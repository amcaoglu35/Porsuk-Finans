# Specify JDK 21 Home (Eclipse Adoptium JDK 21)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot,C:/Program Files/Android/Android Studio/jbr

# Gradle JVM Performance & Memory Optimization (6GB Heap Allocation)
org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError

# Gradle Daemon & Parallel Execution
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.warning.mode=none

# Kotlin & KSP Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=true
kotlin.code.style=official

# AndroidX & Build Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.disallowKotlinSourceSets=false

# Parallel Sync for Gradle
org.gradle.tooling.parallel=true
