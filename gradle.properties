# Specify JDK 21 Home (Eclipse Adoptium JDK 21)
org.gradle.java.home=C\:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C\:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot,C\:/Program Files/Android/Android Studio/jbr

# Gradle JVM Performance & Memory Optimization (6GB Heap Allocation)
org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError

# Gradle Daemon, Caching, Parallel Execution & Configuration Cache
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
org.gradle.warning.mode=none

# Kotlin & KSP Incremental Compilation & Daemon Tuning
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2560m -XX:+UseG1GC
ksp.incremental=false
ksp.incremental.intermodule=false
kotlin.code.style=official

# AndroidX & Build Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=35,36
hilt.enableAggregatingTask=true
dagger.hilt.android.internal.disableAndroidSuperclassValidation=true

# Parallel Sync for Gradle
org.gradle.tooling.parallel=true
