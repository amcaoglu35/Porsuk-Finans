# Specify Android Studio JDK Home & Disable auto-detecting invalid VSCode extension JDKs
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=C:/Program Files/Android/Android Studio/jbr

# Gradle JVM Performance & Memory Optimization
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m

# Gradle Daemon & Parallel Execution
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.warning.mode=summary

# Kotlin & KSP Incremental Compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule=true
kotlin.code.style=official

# AndroidX & Build Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.disallowKotlinSourceSets=false

# Parallel Sync for Gradle
org.gradle.tooling.parallel=true
